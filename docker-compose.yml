services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vacation
      POSTGRES_PASSWORD: vacation
      POSTGRES_DB: vacation
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ./migrations/002_workflow.sql:/docker-entrypoint-initdb.d/002_workflow.sql:ro
      - ./migrations/003_outbox.sql:/docker-entrypoint-initdb.d/003_outbox.sql:ro
      - ./infra/postgres/02_create_camunda_db.sql:/docker-entrypoint-initdb.d/02_create_camunda_db.sql:ro
      - ./infra/postgres/03_create_keycloak_db.sql:/docker-entrypoint-initdb.d/03_create_keycloak_db.sql:ro
      - ./infra/postgres/04_seed_demo_employee.sql:/docker-entrypoint-initdb.d/04_seed_demo_employee.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vacation -d vacation"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres_test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vacation_test
      POSTGRES_PASSWORD: vacation_test
      POSTGRES_DB: vacation_test
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ./migrations/002_workflow.sql:/docker-entrypoint-initdb.d/002_workflow.sql:ro
      - ./migrations/003_outbox.sql:/docker-entrypoint-initdb.d/003_outbox.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vacation_test -d vacation_test"]
      interval: 5s
      timeout: 3s
      retries: 10

  camunda:
    image: camunda/camunda-bpm-platform:run-7.24.0
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      DB_DRIVER: org.postgresql.Driver
      DB_URL: jdbc:postgresql://postgres:5432/camunda
      DB_USERNAME: vacation
      DB_PASSWORD: vacation
      CAMUNDA_BPM_DATABASE_SCHEMA_UPDATE: "true"
    depends_on:
      postgres:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: vacation
      KC_DB_PASSWORD: vacation
      KC_HOSTNAME: http://localhost:8082
      KC_HTTP_ENABLED: "true"
    ports:
      - "127.0.0.1:8082:8080"
    volumes:
      - ./infra/keycloak/vacation-realm.json:/opt/keycloak/data/import/vacation-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  kafka:
    image: apache/kafka:4.1.2
    hostname: kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_LISTENERS: 'CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092'
      CLUSTER_ID: '4L6g3nShT-eMCtK--X86sw'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 15s
      retries: 20
      start_period: 30s

  kafka-init:
    image: apache/kafka:4.1.2
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - /bin/sh
      - -ec
      - '/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic vacation.decisions --partitions 1 --replication-factor 1 && /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic vacation.decisions.dlq --partitions 1 --replication-factor 1'
    restart: "no"

  clickhouse:
    image: clickhouse/clickhouse-server:25.8.33.6
    ports:
      - "127.0.0.1:8123:8123"
    environment:
      CLICKHOUSE_DB: vacation
      CLICKHOUSE_USER: vacation
      CLICKHOUSE_PASSWORD: vacation
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./infra/clickhouse/001_decisions.sql:/docker-entrypoint-initdb.d/001_decisions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user vacation --password vacation --query 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

volumes:
  postgres_data:
  postgres_test_data:
  kafka_data:
  clickhouse_data:
